name: CI/CD

# Least-privilege default for the workflow's GITHUB_TOKEN; jobs that need
# more elevate explicitly. Pipeline logic lives in quantum-sec/actions
# (version-pinned) — converges onto armor/actions at org-move time.
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Serialize runs per ref so two default-branch pushes never race two
# release jobs. The in-progress run always completes; a pending run
# superseded by a newer push is replaced by it (safe here: releases are
# cumulative and validation scans the full tree, so the surviving run
# covers the replaced one's content).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validation
    uses: armor/mdr-actions/.github/workflows/terraform-module-validation.yaml@v3

  release:
    name: Release
    needs: validation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: armor/mdr-actions/.github/workflows/semantic-release.yaml@v3.0.1
    secrets:
      GIT_TOKEN_BASIC: ${{ secrets.GIT_TOKEN_BASIC }}

  update-infrastructure-modules:
    name: Update infrastructure-modules references
    needs: release
    if: needs.release.outputs.semver != ''
    uses: armor/mdr-actions/.github/workflows/update-source-reference.yaml@v3.0.1
    with:
      package_name: mdr-terraform-azurerm-sentinel-rules
    secrets:
      GIT_TOKEN_BASIC: ${{ secrets.GIT_TOKEN_BASIC }}
      CI_BOT_GPG_KEY: ${{ secrets.CI_BOT_GPG_KEY }}
      CI_BOT_GPG_KEY_ID: ${{ secrets.CI_BOT_GPG_KEY_ID }}
      CI_BOT_GPG_KEY_PASSPHRASE: ${{ secrets.CI_BOT_GPG_KEY_PASSPHRASE }}
      CI_BOT_GPG_KEY_SUBJECT: ${{ secrets.CI_BOT_GPG_KEY_SUBJECT }}
